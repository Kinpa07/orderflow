[project]
name = "orderflow"
version = "0.1.0"
description = ""
authors = [
    {name = "Veselin Iliev",email = "veneli93@gmail.com"}
]
requires-python = ">=3.13"
dependencies = ["fastapi (>=0.136.1,<0.137.0)", "uvicorn (>=0.46.0,<0.47.0)", "structlog (>=25.5.0,<26.0.0)"]

[dependency-groups]
dev = ["ruff>=0.15.12,<0.16.0", "mypy>=1.20.2,<2.0.0"]
test = ["pytest>=8.0", "pytest-cov>=6.0", "pytest-asyncio (>=1.3.0,<2.0.0)"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
strict = true
python_version = "3.13"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"