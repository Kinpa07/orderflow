[project]
name = "orderflow"
version = "0.1.0"
description = ""
authors = [
    {name = "Veselin Iliev",email = "veneli93@gmail.com"}
]
requires-python = ">=3.13"
dependencies = ["fastapi (>=0.136.1,<0.137.0)", "prometheus-client (>=0.21.0,<1.0.0)", "uvicorn (>=0.46.0,<0.47.0)", "structlog (>=25.5.0,<26.0.0)", "sqlalchemy[asyncio] (>=2.0.49,<3.0.0)", "asyncpg (>=0.31.0,<0.32.0)", "alembic (>=1.18.4,<2.0.0)", "typer (>=0.25.1,<0.26.0)", "httpx (>=0.28.1,<0.29.0)", "redis[asyncio] (>=7.4.0,<8.0.0)"]

[project.scripts]
orderflow = "cli:app"

[dependency-groups]
dev = ["ruff>=0.15.12,<0.16.0", "mypy>=1.20.2,<2.0.0", "httpx (>=0.28.1,<0.29.0)"]
test = ["pytest>=8.0", "pytest-cov>=6.0", "pytest-asyncio (>=1.3.0,<2.0.0)", "pytest-dotenv (>=0.5.2,<0.6.0)"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.poetry]
packages = [{include = "cli.py"}]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = "."
env_files = [".env.test"]

[tool.coverage.run]
omit = ["tests/*", "alembic/*", "load_test.py", "cli.py", "order_processor/main.py"]

[tool.coverage.report]
fail_under = 80


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"